<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio de Eduardo Bermúdez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: banco de pruebas oscuro. Un marco con pistas de cobre contiene tres vistas (Sobre mí, Proyectos, Contacto); cada proyecto lleva el símbolo esquemático de su área. */
:root {
--bg: #0A0B0D;
--panel: #111317;
--raise: #171A1F;
--line: #262A31;
--ink: #ECEEF1;
--muted: #9AA2AD;
--copper: #8EC9F5;
--copper-soft: rgba(142, 201, 245, .13);
--ok: #8DBFA4;
--font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
--font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
--font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 18px; }
/* Barra */
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 22px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.1; }
.brand small { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--copper); margin-top: 3px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em; padding: 6px 11px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--copper); color: #08131F; }
.tabs { display: flex; justify-content: center; gap: 6px; margin: 26px 0 18px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; cursor: pointer; font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 8px 14px; border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--copper); }
/* Marco */
.frame { position: relative; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow: hidden; }
.frame::before { content: ""; position: absolute; inset: 0; pointer-events: none;
background-image: radial-gradient(rgba(142,201,245,.22) 1px, transparent 1.3px); background-size: 14px 14px;
-webkit-mask-image: radial-gradient(ellipse at center, transparent 58%, #000 100%); mask-image: radial-gradient(ellipse at center, transparent 58%, #000 100%); }
.frame-in { position: relative; padding: clamp(22px, 5vw, 56px); }
.corner { position: absolute; width: 18px; height: 18px; border-color: var(--copper); border-style: solid; opacity: .8; }
.c1 { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
.c2 { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
.c3 { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }
.c4 { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }
.view[hidden] { display: none; }
.view { animation: in .35s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
h1 { font-family: var(--font-display); font-weight: 300; font-size: clamp(2.5rem, 7vw, 4.6rem); line-height: 1; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; letter-spacing: -.015em; margin: 0 0 22px; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; line-height: 1.25; margin: 0; text-wrap: balance; }
/* Sobre mí */
.about { display: grid; gap: 34px; grid-template-columns: 1fr; align-items: center; }
@media (min-width: 880px) { .about { grid-template-columns: 1.35fr .65fr; } }
.role { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; color: var(--copper); margin: 14px 0 0; }
.bio { color: var(--muted); max-width: 62ch; margin: 18px 0 0; font-size: 1.04rem; }
.chip-art { width: 100%; max-width: 300px; justify-self: center; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 36px; }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--panel); padding: 16px 18px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.award { display: flex; gap: 16px; align-items: center; margin-top: 22px; padding: 16px 18px; border: 1px solid rgba(142,201,245,.45); border-radius: 12px; background: var(--copper-soft); }
.award svg { width: 38px; height: 38px; flex: none; }
.award b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.award span { color: var(--muted); font-size: .94rem; }
.events { margin-top: 26px; }
.events h4, .skill-group h4 { margin: 0 0 10px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--copper); }
.events ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.events li { display: grid; grid-template-columns: 92px 1fr; gap: 14px; background: var(--panel); padding: 12px 16px; }
.events li span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.events li b { font-weight: 500; }
.events li em { display: block; font-style: normal; color: var(--muted); font-size: .92rem; }
.skills { margin-top: 40px; display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .skills { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1040px) { .skills { grid-template-columns: repeat(3, 1fr); } }
.skill-group h4 { margin: 0 0 10px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--copper); }
.tags { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li { font-family: var(--font-mono); font-size: 11.5px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--raise); }
/* Proyectos */
.featured { display: grid; gap: 14px; grid-template-columns: 1fr; margin-bottom: 34px; }
@media (min-width: 760px) { .featured { grid-template-columns: repeat(2, 1fr); } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.filters button { cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .04em; color: var(--muted); }
.filters button:hover { color: var(--ink); border-color: #3A3F48; }
.filters button[aria-pressed="true"] { color: #08131F; background: var(--copper); border-color: var(--copper); }
.filters em { font-style: normal; opacity: .7; margin-left: 6px; }
.grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1020px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.card { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--raise); overflow: hidden; transition: border-color .2s, transform .2s; }
.card:hover { border-color: rgba(142,201,245,.6); transform: translateY(-2px); }
.card-top { position: relative; height: 104px; border-bottom: 1px solid var(--line);
background: radial-gradient(rgba(142,201,245,.16) 1px, transparent 1.3px) 0 0 / 12px 12px, linear-gradient(135deg, #15181D, #0E1013); }
.featured .card-top { height: 150px; }
.card-top svg { position: absolute; right: 18px; bottom: 12px; width: 76px; height: 76px; color: var(--copper); }
.featured .card-top svg { width: 112px; height: 112px; }
.card-top .code { position: absolute; left: 16px; top: 14px; right: 110px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.card-body { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; flex: 1; }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.pill { position: absolute; right: 14px; top: 12px; flex: none; background: rgba(10,11,13,.6); font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid #2E3A33; color: var(--ok); }
.pill.now { border-color: rgba(142,201,245,.6); color: var(--copper); }
.short { margin: 0; color: var(--muted); font-size: .94rem; }
.detail { margin: 0; color: var(--ink); font-size: .92rem; border-left: 2px solid var(--copper); padding-left: 10px; }
.card-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.more { white-space: nowrap; flex: none; cursor: pointer; border: 0; background: none; color: var(--copper); font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; padding: 4px 0; }
.more:hover { text-decoration: underline; }
/* Contacto */
.contact { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .contact { grid-template-columns: 1fr 1fr; } }
.box { border: 1px solid var(--line); border-radius: 12px; background: var(--raise); padding: 20px; }
.box h3 { margin-bottom: 8px; }
.box p { margin: 0; color: var(--muted); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; padding-top: 22px; padding-bottom: 40px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } .card, .card:hover { transition: none; transform: none; } }
.sec-h { margin: 44px 0 14px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--copper); }
.does { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .does { grid-template-columns: repeat(2, 1fr); } }
.do { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px 22px; }
.do i { display: block; font-style: normal; font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; color: var(--copper); margin-bottom: 10px; }
.do h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 500; font-size: 1.22rem; line-height: 1.25; }
.do p { margin: 0 0 14px; color: var(--muted); font-size: .95rem; line-height: 1.55; }
.now { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 28px; }
@media (min-width: 760px) { .now { grid-template-columns: repeat(2, 1fr); } }
.now div { background: var(--panel); padding: 16px 20px; }
.now small { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--copper); margin-bottom: 6px; }
.now b { display: block; font-weight: 500; }
.now span { color: var(--muted); font-size: .92rem; }
.proj-lead { margin: -6px 0 26px; max-width: 62ch; color: var(--muted); font-size: 1rem; line-height: 1.6; }
.mail { display: inline-block; margin-top: 12px; font-family: var(--font-mono); font-size: .95rem; color: var(--copper); text-decoration: none; border-bottom: 1px solid rgba(142,201,245,.45); padding-bottom: 2px; word-break: break-all; }
.mail:hover { border-bottom-color: var(--copper); }
</style>
</head>
